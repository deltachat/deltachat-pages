<div class="socials">
	<details class="languages">
		<summary>🌐 {%if tx.language != ""%}{{ tx.language }}{%else%}{{ txEn.language }}{%endif%}</summary>
		<div>{% include footer-languages.html %}</div>
	</details>
	<a href="../feed.xml">
		<img src="../assets/css/feed-icon.png" alt="">
		RSS-Feed
	</a>
	<a rel="me" href="https://chaos.social/@delta">
		<img src="../assets/css/mastodon-icon.svg" alt="">
		Mastodon
	</a>
</div>
<script>
// close the language menu when tapping outside
document.addEventListener('click', function (e) {
	var menu = document.querySelector('details.languages');
	if (menu.open && !menu.contains(e.target)) menu.open = false;
});
</script>
